; Supervisor configuration for Negarify queue workers
; Place this file in /etc/supervisor/conf.d/negarify-worker.conf
; Then run: sudo supervisorctl reread && sudo supervisorctl update

[program:negarify-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/negarify/worker.log
stopwaitsecs=3600
stopasgroup=true
killasgroup=true

; Environment variables (optional)
; environment=APP_ENV="production"

; Notes:
; - Replace /path/to/artisan with actual path to artisan file
; - Replace /var/log/negarify/worker.log with desired log path
; - Adjust numprocs based on server capacity (4 is default)
; - max-time=3600 (1 hour) prevents memory leaks by restarting workers
; - sleep=3 prevents CPU spinning when queue is empty
; - tries=3 is handled by job classes, not worker command

